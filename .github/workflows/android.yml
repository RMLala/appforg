name: AppForge Studio Android
on:
  push:
    branches: [appforge/studio-v15.5-cloud-sync, appforge/studio-v15.8-premium]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept licenses and install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: npm ci
      - run: npm run sync
      - name: Test Ultimate Business integration safeguards after HTML build
        run: npm run test:ultimate
      - name: Test automatic license-based Cloud sync
        run: npm run test:cloud
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleApi23Debug
          mkdir -p ../release-output
          cp app/build/outputs/apk/api23/debug/app-api23-debug.apk ../release-output/AppForge-Studio-Ultimate-15.8.12-Debug-API23.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.12-Debug-API23
          path: release-output/AppForge-Studio-Ultimate-15.8.12-Debug-API23.apk
          if-no-files-found: error
          retention-days: 30
      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Secret KEYSTORE_BASE64 absent"; exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret KEY_ALIAS absent"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret KEYSTORE_PASSWORD absent"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret KEY_PASSWORD absent"; exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release-key.jks"
      - name: Build signed API 23 and API 29 APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon assembleApi23Release assembleApi29Release
          mkdir -p ../release-output
          cp app/build/outputs/apk/api23/release/app-api23-release.apk ../release-output/AppForge-Studio-Ultimate-15.8.12-Release-API23.apk
          cp app/build/outputs/apk/api29/release/app-api29-release.apk ../release-output/AppForge-Studio-Ultimate-15.8.12-Release-API29.apk
      - name: Verify signed APKs
        run: |
          test -s release-output/AppForge-Studio-Ultimate-15.8.12-Release-API23.apk
          test -s release-output/AppForge-Studio-Ultimate-15.8.12-Release-API29.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release-output/AppForge-Studio-Ultimate-15.8.12-Release-API23.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release-output/AppForge-Studio-Ultimate-15.8.12-Release-API29.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.12-Signed-Release-API23-API29
          path: release-output/AppForge-Studio-Ultimate-15.8.12-Release-API*.apk
          if-no-files-found: error
          retention-days: 30
  launch-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.12-Signed-Release-API23-API29
          path: release-output
      - name: Install screenshot comparison dependency
        run: python3 -m pip install --user --disable-pip-version-check Pillow
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo 'KVM device unavailable; emulator will use software rendering'; fi
      - name: Launch on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            if [ '${{ matrix.api-level }}' = '23' ]; then adb install -r release-output/AppForge-Studio-Ultimate-15.8.12-Release-API23.apk; else adb install -r release-output/AppForge-Studio-Ultimate-15.8.12-Release-API29.apk; fi
            adb shell am force-stop mg.appforge.studio
            adb shell am start -n mg.appforge.studio/.MainActivity
            sleep 25
            adb shell screencap -p /sdcard/appforge-precheck.png
            adb pull /sdcard/appforge-precheck.png appforge-precheck.png >/dev/null
            adb logcat -d -b crash > appforge-crash-precheck.log
            adb logcat -d -s chromium:E cr_Console:E > appforge-webview-precheck.log
            adb shell uiautomator dump /sdcard/appforge-before.xml >/dev/null 2>&1 || echo "uiautomator dump unavailable"
            adb pull /sdcard/appforge-before.xml appforge-before.xml >/dev/null 2>&1 || echo "accessibility XML unavailable"
            if [ -s appforge-before.xml ]; then cat appforge-before.xml; else echo "ACCESSIBILITY_XML_MISSING"; fi
            python3 -c 'import os,re,xml.etree.ElementTree as ET,subprocess; from PIL import Image; im=Image.open("appforge-precheck.png"); fallback=(round(im.width*0.28),round(im.height*0.09)); r=ET.parse("appforge-before.xml").getroot() if os.path.exists("appforge-before.xml") else None; ns=list(r.iter("node")) if r is not None else []; n=next((x for x in ns if "menutoggle" in x.attrib.get("resource-id","").lower() or "ouvrir toutes les rubriques" in (x.attrib.get("content-desc","")+" "+x.attrib.get("text","")).lower() or "ouvrir le menu" in (x.attrib.get("content-desc","")+" "+x.attrib.get("text","")).lower() or "☰" in x.attrib.get("text","")),None); vals=list(map(int,re.findall(r"-?\d+",n.attrib.get("bounds","")))) if n is not None else []; rv=list(map(int,re.findall(r"-?\d+",r.attrib.get("bounds","")))) if r is not None else []; sx=im.width/max(1,rv[2]-rv[0]) if len(rv)==4 else 1; sy=im.height/max(1,rv[3]-rv[1]) if len(rv)==4 else 1; p=(round(((vals[0]+vals[2])/2-(rv[0] if len(rv)==4 else 0))*sx),round(((vals[1]+vals[3])/2-(rv[1] if len(rv)==4 else 0))*sy)) if len(vals)==4 else fallback; print("Tap",n.attrib.get("bounds") if n is not None else "fallback",p,"screen",im.size,"root",r.attrib.get("bounds") if r is not None else "missing"); subprocess.run(["adb","shell","input","tap",str(p[0]),str(p[1])],check=True)'
            sleep 2
            adb shell screencap -p /sdcard/appforge-interaction.png
            adb pull /sdcard/appforge-interaction.png appforge-interaction.png >/dev/null
            python3 -c 'from PIL import Image, ImageChops; before=Image.open("appforge-precheck.png").convert("RGB"); after=Image.open("appforge-interaction.png").convert("RGB"); assert before.size==after.size, "Emulator screenshots have different dimensions"; h=ImageChops.difference(before,after).histogram(); changed=sum(v for i,v in enumerate(h) if i%256!=0); assert changed>20000, "Studio menu tap produced no visible UI change"'
            adb logcat -d -b crash > appforge-crash.log
            adb logcat -d -s AndroidRuntime:E > appforge-androidruntime.log
            adb logcat -d -s chromium:E cr_Console:E > appforge-webview-errors.log
            if grep -Ei 'Uncaught SyntaxError|Unexpected token|Uncaught ReferenceError' appforge-webview-errors.log; then echo 'WebView JavaScript error detected'; exit 1; fi
            cat appforge-crash.log appforge-androidruntime.log
            ! grep -F 'FATAL EXCEPTION' appforge-crash.log appforge-androidruntime.log
            adb shell pidof mg.appforge.studio | grep -q '[0-9]'
            adb shell screencap -p /sdcard/appforge-smoke.png
            adb pull /sdcard/appforge-smoke.png appforge-smoke.png
            test -s appforge-smoke.png
      - name: Upload Android 13 launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.12-Android-${{ matrix.api-level }}-launch-evidence
          path: |
            appforge-smoke.png
            appforge-precheck.png
            appforge-before.xml
            appforge-crash-precheck.log
            appforge-webview-precheck.log
            appforge-interaction.png
            appforge-crash.log
            appforge-androidruntime.log
            appforge-webview-errors.log
          if-no-files-found: ignore
          retention-days: 14
