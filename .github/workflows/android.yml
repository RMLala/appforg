name: AppForge Studio Android
on:
  push:
    branches: [appforge/studio-v15.5-cloud-sync, appforge/studio-v15.8-premium]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept licenses and install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: npm ci
      - run: npm run sync
      - name: Test Ultimate Business integration safeguards after HTML build
        run: npm run test:ultimate
      - name: Test automatic license-based Cloud sync
        run: npm run test:cloud
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleApi23Debug
          mkdir -p ../release-output
          cp app/build/outputs/apk/api23/debug/app-api23-debug.apk ../release-output/AppForge-Studio-Ultimate-15.8.10-Debug-API23.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.10-Debug-API23
          path: release-output/AppForge-Studio-Ultimate-15.8.10-Debug-API23.apk
          if-no-files-found: error
          retention-days: 30
      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Secret KEYSTORE_BASE64 absent"; exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret KEY_ALIAS absent"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret KEYSTORE_PASSWORD absent"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret KEY_PASSWORD absent"; exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release-key.jks"
      - name: Build signed API 23 and API 29 APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon assembleApi23Release assembleApi29Release
          mkdir -p ../release-output
          cp app/build/outputs/apk/api23/release/app-api23-release.apk ../release-output/AppForge-Studio-Ultimate-15.8.10-Release-API23.apk
          cp app/build/outputs/apk/api29/release/app-api29-release.apk ../release-output/AppForge-Studio-Ultimate-15.8.10-Release-API29.apk
      - name: Verify signed APKs
        run: |
          test -s release-output/AppForge-Studio-Ultimate-15.8.10-Release-API23.apk
          test -s release-output/AppForge-Studio-Ultimate-15.8.10-Release-API29.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release-output/AppForge-Studio-Ultimate-15.8.10-Release-API23.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release-output/AppForge-Studio-Ultimate-15.8.10-Release-API29.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.10-Signed-Release-API23-API29
          path: release-output/AppForge-Studio-Ultimate-15.8.10-Release-API*.apk
          if-no-files-found: error
          retention-days: 30
  launch-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.10-Signed-Release-API23-API29
          path: release-output
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo 'KVM device unavailable; emulator will use software rendering'; fi
      - name: Launch on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            if [ '${{ matrix.api-level }}' = '23' ]; then adb install -r release-output/AppForge-Studio-Ultimate-15.8.10-Release-API23.apk; else adb install -r release-output/AppForge-Studio-Ultimate-15.8.10-Release-API29.apk; fi
            adb shell am force-stop mg.appforge.studio
            adb shell am start -n mg.appforge.studio/.MainActivity
            sleep 25
            adb logcat -d -b crash > appforge-crash.log
            adb logcat -d -s AndroidRuntime:E > appforge-androidruntime.log
            adb logcat -d -s chromium:E cr_Console:E > appforge-webview-errors.log
            if grep -Ei 'Uncaught SyntaxError|Unexpected token|Uncaught ReferenceError' appforge-webview-errors.log; then echo 'WebView JavaScript error detected'; exit 1; fi
            cat appforge-crash.log appforge-androidruntime.log
            ! grep -F 'FATAL EXCEPTION' appforge-crash.log appforge-androidruntime.log
            adb shell pidof mg.appforge.studio | grep -q '[0-9]'
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | grep -F 'mg.appforge.studio'
            adb shell screencap -p /sdcard/appforge-smoke.png
            adb pull /sdcard/appforge-smoke.png appforge-smoke.png
            test -s appforge-smoke.png
      - name: Upload Android 13 launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-Studio-Ultimate-15.8.10-Android-${{ matrix.api-level }}-launch-evidence
          path: |
            appforge-smoke.png
            appforge-crash.log
            appforge-androidruntime.log
            appforge-webview-errors.log
          if-no-files-found: ignore
          retention-days: 14
