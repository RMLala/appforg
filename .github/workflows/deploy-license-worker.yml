name: Deploy AppForge license and cloud Worker
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm applying the D1 migration and deploying the Worker
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    if: inputs.confirm_production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/license-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Require canonical Cloudflare account and deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Secret CLOUDFLARE_API_TOKEN absent"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Secret CLOUDFLARE_ACCOUNT_ID absent"; exit 1)
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "950250f745ef2c98e286b9b120a6cae4" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID ne correspond pas au compte Cloudflare lalainaadclick."
            exit 1
          fi
          npx wrangler secret list --name appforge-license-api --format json > /tmp/worker-secrets.json
          node -e "const fs=require('node:fs');const names=new Set(JSON.parse(fs.readFileSync('/tmp/worker-secrets.json','utf8')).map(x=>x.name));const required=['ADMIN_API_TOKEN','LICENSE_SIGNING_PRIVATE_JWK','CODE_HASH_PEPPER'];const missing=required.filter(x=>!names.has(x));if(missing.length){console.error('Secrets Worker manquants: '+missing.join(', '));process.exit(1)}"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply appforge-licenses --remote
      - name: Deploy license and cloud API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify deployed Worker routes
        env:
          WORKER_BASE_URL: https://appforge-license-api.lalainaadclick.workers.dev
        run: |
          curl --fail --silent --show-error "$WORKER_BASE_URL/health" > /tmp/worker-health.json
          node -e "const x=require('/tmp/worker-health.json'); if(!x.ok) process.exit(1)"
          curl --fail --silent --show-error "$WORKER_BASE_URL/v1/config" > /tmp/worker-config.json
          node -e "const x=require('/tmp/worker-config.json'); if(!x.publicKey || x.publicKey.kty!=='EC' || x.publicKey.crv!=='P-256' || x.protocol!=='appforge-license-v1') process.exit(1)"
          status=$(curl --silent --show-error --output /tmp/worker-snapshot.json --write-out '%{http_code}' "$WORKER_BASE_URL/v1/cloud/snapshot?resource=deploy-probe")
          if [ "$status" != "401" ]; then
            echo "GET /v1/cloud/snapshot doit reconnaître la route et refuser un appel sans jeton (attendu 401, obtenu $status)."
            cat /tmp/worker-snapshot.json
            exit 1
          fi
