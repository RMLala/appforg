name: Deploy AppForge license and cloud Worker
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm applying the D1 migration and deploying the Worker
        required: true
        type: choice
        options:
          - no
          - yes
permissions:
  contents: read
jobs:
  deploy:
    if: inputs.confirm_production == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/license-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Require Cloudflare deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Secret CLOUDFLARE_API_TOKEN absent"; exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Secret CLOUDFLARE_ACCOUNT_ID absent"; exit 1)
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply appforge-licenses --remote
      - name: Deploy license and cloud API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify deployed Worker routes
        run: |
          curl --fail --silent --show-error https://appforge-license-api.appforge-licences-mg.workers.dev/health | tee /tmp/worker-health.json
          node -e "const x=require('/tmp/worker-health.json'); if(!x.ok) process.exit(1)"
          curl --fail --silent --show-error https://appforge-license-api.appforge-licences-mg.workers.dev/v1/config | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.publicKey||x.protocol!=='appforge-license-v1')process.exit(1)})"
