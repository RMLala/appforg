name: License Cloud permissions and quotas
on:
  pull_request:
    paths:
      - 'cloud/license-worker/**'
      - '.github/workflows/license-cloud-entitlements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloud/license-worker/tests/cloud-entitlements.test.mjs
