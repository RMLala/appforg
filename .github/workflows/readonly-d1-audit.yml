name: Temporary read-only AppForge D1 audit
on:
  push:
    branches:
      - audit/d1-readonly-20261119
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/license-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Check secret presence and account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN absent"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID absent"; exit 1; }
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "950250f745ef2c98e286b9b120a6cae4" ]; then
            echo "The configured account is not the expected Cloudflare account."
            exit 1
          fi
          echo "Cloudflare secrets are available; account check passed."
      - name: Read production D1 without changing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          echo "PRODUCTS (IDs, names, status only)"
          npx wrangler d1 execute appforge-licenses --remote --json --command "SELECT product_id, name, status FROM products ORDER BY product_id;"
          echo "LICENSE ENTITLEMENT COUNTS (no customer or code fields)"
          npx wrangler d1 execute appforge-licenses --remote --json --command "SELECT product_id, status, paid_confirmed, cloud_enabled, license_type, COUNT(*) AS license_count FROM licenses GROUP BY product_id, status, paid_confirmed, cloud_enabled, license_type ORDER BY product_id, status, paid_confirmed, cloud_enabled, license_type;"
          echo "TEST-LABEL COUNTS ONLY"
          npx wrangler d1 execute appforge-licenses --remote --json --command "SELECT product_id, COUNT(*) AS test_labelled_count FROM licenses WHERE lower(COALESCE(license_type,'')) LIKE '%test%' OR lower(COALESCE(plan,'')) LIKE '%test%' OR lower(COALESCE(customer_name,'')) LIKE '%test%' OR lower(COALESCE(payment_reference,'')) LIKE '%test%' GROUP BY product_id;"
          echo "LICENSE SCHEMA"
          npx wrangler d1 execute appforge-licenses --remote --json --command "PRAGMA table_info(licenses);"
          echo "MIGRATION HISTORY"
          if npx wrangler d1 execute appforge-licenses --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;"; then
            :
          else
            echo "Migration history table unavailable; schema output above remains available."
          fi
          echo "TRIAL COUNTS BY PRODUCT (no installation identifiers)"
          npx wrangler d1 execute appforge-licenses --remote --json --command "SELECT product_id, COUNT(*) AS trial_count, SUM(CASE WHEN julianday(expires_at)>julianday('now') THEN 1 ELSE 0 END) AS active_trial_count FROM trials GROUP BY product_id ORDER BY product_id;"
